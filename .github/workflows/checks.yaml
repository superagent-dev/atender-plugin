name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The drift alarm: a deploy of sa-replit can change the live server with no change here.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks and evals
    # PLUGIN_RUNNER moves the job to a self-hosted runner on hermes3, unset it runs on GitHub.
    # sa-replit docs/guides/operations.md § CI runners on hermes3 holds the pattern and the runners.
    runs-on: ${{ vars.PLUGIN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Files
        run: node scripts/check.mjs
      - name: Files against the live server
        run: node scripts/check.mjs --live
      - name: Review cases against the live server
        env:
          REVIEW_LOGIN_EMAIL: ${{ secrets.REVIEW_LOGIN_EMAIL }}
          REVIEW_LOGIN_PASSWORD: ${{ secrets.REVIEW_LOGIN_PASSWORD }}
        run: node scripts/evals.mjs
      - name: TEMPORARY forced failure
        if: github.event_name == 'workflow_dispatch'
        run: exit 1

  tell:
    name: Tell the team
    needs: checks
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.PLUGIN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::notice::SLACK_BOT_TOKEN is not set, so the daily check alarm is not posted to Slack."
            exit 0
          fi
          scripts/slack-post.sh "Plugin · daily check failed · ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

